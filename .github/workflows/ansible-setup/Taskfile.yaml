version: "3"

env:
  GITHUB_TOKEN:
    sh: gh auth token
  GCP_SSH_PRIVATE_KEY:
    sh: cat name_of_file # read from private key file or environment variable
  GCP_SERVICE_ACCOUNT_CONTENTS:
    sh: cat name_of_file | base64 | tr -d '\n' 
  GCP_USERNAME: "example"
  GCP_PROJECT_NAME: "example_project"
  GCP_PROJECT_ZONE: ""

tasks:
  ansible-setup:
    desc: Run Ansible playbook setup workflow
    cmds: 
      - |
        act workflow_dispatch \
        --container-architecture linux/amd64 \
        -s GITHUB_TOKEN="{{.GITHUB_TOKEN}}" \
        -s GCP_SSH_PRIVATE_KEY="{{.GCP_SSH_PRIVATE_KEY}}" \
        -s GCP_USERNAME="{{.GCP_USERNAME}}" \
        -s GCP_SERVICE_ACCOUNT_CONTENTS='{{.GCP_SERVICE_ACCOUNT_CONTENTS}}' \
        --var GCP_PROJECT_NAME="{{.GCP_PROJECT_NAME}}" \
        --var GCP_PROJECT_ZONE="{{.GCP_PROJECT_ZONE}}" \
        -e {{.PWD}}/event.json \
        -P ubuntu-latest=catthehacker/ubuntu:act-latest \
        --directory ../../.. \
        -W .github/workflows/ansible-setup.yaml

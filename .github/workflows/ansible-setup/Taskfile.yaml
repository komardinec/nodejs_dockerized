version: "3"

env:
  GITHUB_TOKEN:
    sh: gh auth token
  GCP_SSH_PRIVATE_KEY:
    sh: cat test-dockerized
  GCP_USERNAME: "test"

tasks:
  ansible-setup:
    desc: Run Ansible playbook setup workflow
    cmds: 
      - |
        act workflow_dispatch \
        --container-architecture linux/amd64 \
        -s GITHUB_TOKEN="{{.GITHUB_TOKEN}}" \
        -s GCP_SSH_PRIVATE_KEY="{{.GCP_SSH_PRIVATE_KEY}}" \
        -s GCP_USERNAME="{{.GCP_USERNAME}}" \
        -e {{.PWD}}/event.json \
        -P ubuntu-latest=catthehacker/ubuntu:act-latest \
        --directory ../../.. \
        -W .github/workflows/ansible-setup.yaml

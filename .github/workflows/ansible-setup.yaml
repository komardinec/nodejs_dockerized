name: Set up GCP instances using Ansible with dynamic inventory

on:
  workflow_dispatch:

jobs:
 ansible:
    name: Main Ansible CI workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout directory of project 
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch_depth: 100
     # - name: Set up Docker
     #   uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
      - name: Install Ansible and GCP requirements in runner
        run: |
          sudo apt update
          sudo apt install -y ansible python3-requests python3-google-auth
          pwd
      - name: Add SSH private_key to the environment
        working-directory: ./ansible
        run: |
          echo "::add-mask::${{secrets.GCP_SSH_PRIVATE_KEY}}"
          echo "${{secrets.GCP_SSH_PRIVATE_KEY}}" > private_key.pem
          chmod 600 private_key.pem
      - name: Create .env file for node.js server
        env:
          NODEJS_SERVER_PORT: ${{ secrets.NODEJS_SERVER_PORT }}
          NODEJS_SECRET_MESSAGE: ${{ secrets.NODEJS_SECRET_MESSAGE }}
          NODEJS_SECRET_USER: ${{ secrets.NODEJS_SECRET_USER }}
          NODEJS_SECRET: ${{ secrets.NODEJS_SECRET }}
        working-directory: ./docker-ci
        run: |
          cat << EOF > ./node/.env
          SERVER_PORT="$NODEJS_SERVER_PORT"
          SECRET_MESSAGE="$NODEJS_SECRET_MESSAGE"
          SECRET_USER="$NODEJS_SECRET_USER"
          SECRET="$NODEJS_SECRET"
          EOF

      - name: Export service account content to file
        working-directory: ./ansible/inventory
        run: |
          echo "::add-mask::${{secrets.GCP_SERVICE_ACCOUNT_CONTENTS}}"
          $(echo -n -e  "${{secrets.GCP_SERVICE_ACCOUNT_CONTENTS}}" | base64 --decode > service_account_file.json) > /dev/null 2>&1
          chmod 600 service_account_file.json
          cat service_account_file.json
      - name: Run Ansible playbook with dynamic inventory
        working-directory: ./ansible
        run: |
          ansible-playbook playbooks/main.yaml --private-key private_key.pem -u "${{secrets.GCP_USERNAME}}" -vvvv
          



